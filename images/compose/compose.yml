# Package metadata must advertise an origin reachable by package clients.
x-pulp-environment: &pulp-environment
  PULP_CONTENT_ORIGIN: ${PULP_CONTENT_ORIGIN:-http://localhost:8080}
  PULP_STORAGE_BACKEND: ${PULP_STORAGE_BACKEND:-rustfs}
  PULP_S3_ENDPOINT_URL: http://rustfs:9000
  PULP_S3_BUCKET: ${PULP_S3_BUCKET:-pulp}
  PULP_S3_REGION: us-east-1
  PULP_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
  PULP_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
  PULP_API_WORKERS: ${PULP_API_WORKERS:-1}
  PULP_CONTENT_WORKERS: ${PULP_CONTENT_WORKERS:-1}

# Use an identical plugin set in API/content/workers and initialization jobs.
x-pulp-image: &pulp-image
  image: local/pulp-minimal-nuget:3.123.2
  build:
    context: .
    dockerfile: Containerfile.plugins

services:
  rustfs_volume_service:
    <<: *pulp-image
    user: root
    command: ["sh", "-c", "chown 10001:10001 /data /logs"]
    volumes:
      - "rustfs_data:/data"
      - "rustfs_logs:/logs"

  rustfs:
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    depends_on:
      rustfs_volume_service:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - "rustfs_data:/data"
      - "rustfs_logs:/logs"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  object_storage_service:
    <<: *pulp-image
    user: pulp
    environment: *pulp-environment
    command: ["python3", "/usr/bin/init_object_storage.py"]
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - "./assets/init_object_storage.py:/usr/bin/init_object_storage.py:ro,Z"

  storage_migration_service:
    <<: *pulp-image
    profiles: ["maintenance"]
    user: pulp
    environment: *pulp-environment
    command: ["python3", "/usr/bin/migrate_object_storage.py", "--source", "/var/lib/pulp/media"]
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
    volumes:
      - "./assets/init_object_storage.py:/usr/bin/init_object_storage.py:ro,Z"
      - "./assets/migrate_object_storage.py:/usr/bin/migrate_object_storage.py:ro,Z"
      - "pulp:/var/lib/pulp:ro"

  postgres:
    image: "docker.io/library/postgres:16"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pulp
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulp
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
      POSTGRES_HOST_AUTH_METHOD: 'scram-sha-256'
    volumes:
      - "pg_data:/var/lib/postgresql/data"
      - "./assets/postgres/passwd:/etc/passwd:Z"
    restart: always
    healthcheck:
      test: pg_isready -U pulp
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: "docker.io/library/redis:latest"
    volumes:
      - "redis_data:/data"
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  migration_service:
    <<: *pulp-image
    environment: *pulp-environment
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: pulpcore-manager migrate --noinput
    volumes:
      - "./assets/settings.py:/etc/pulp/settings.py:z"
      - "./assets/certs:/etc/pulp/certs:z"
      - "pulp:/var/lib/pulp"

  container_auth_key_service:
    <<: *pulp-image
    user: pulp
    command: ["python3", "/usr/bin/init_container_auth.py"]
    volumes:
      - "./assets/init_container_auth.py:/usr/bin/init_container_auth.py:ro,Z"
      - "./assets/certs:/etc/pulp/certs:z"

  signing_key_service:
    <<: *pulp-image
    environment: *pulp-environment
    command: sh -c "add_signing_service.sh"
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migration_service: 
        condition: service_completed_successfully
    volumes:
      - "./assets/settings.py:/etc/pulp/settings.py:z"
      - "./assets/certs:/etc/pulp/certs:z"
      - "pulp:/var/lib/pulp"

  set_init_password_service:
    <<: *pulp-image
    command: set_init_password.sh
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migration_service:
        condition: service_completed_successfully
    environment:
      <<: *pulp-environment
      PULP_DEFAULT_ADMIN_PASSWORD: password
    volumes:
      - "./assets/settings.py:/etc/pulp/settings.py:z"
      - "./assets/certs:/etc/pulp/certs:z"
      - "pulp:/var/lib/pulp"

  pulp_web:
    image: "pulp/pulp-web:latest"
    command: ['/usr/bin/nginx.sh']
    depends_on:
      pulp_api:
        condition: service_healthy
      pulp_content:
        condition: service_healthy
    ports:
      - "8080:8080"
    hostname: pulp
    user: root
    volumes:
      - "./assets/bin/nginx.sh:/usr/bin/nginx.sh:Z"
      - "./assets/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:Z"
    restart: always

  pulp_api:
    <<: *pulp-image
    environment: *pulp-environment
    deploy:
      replicas: ${PULP_API_REPLICAS:-1}
    command: ['pulp-api']
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
      container_auth_key_service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration_service:
        condition: service_completed_successfully
      set_init_password_service:
        condition: service_completed_successfully
      signing_key_service:
        condition: service_completed_successfully
    hostname: pulp-api
    user: pulp
    volumes:
      - "./assets/settings.py:/etc/pulp/settings.py:z"
      - "./assets/certs:/etc/pulp/certs:z"
      - "pulp:/var/lib/pulp"
    restart: always
    healthcheck:
      test: readyz.py /pulp/api/v3/status/
      interval: 10s
      timeout: 5s
      retries: 5

  pulp_content:
    <<: *pulp-image
    environment: *pulp-environment
    deploy:
      replicas: ${PULP_CONTENT_REPLICAS:-1}
    command: ['pulp-content']
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
      container_auth_key_service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration_service:
        condition: service_completed_successfully
    hostname: pulp-content
    user: pulp
    volumes:
      - "./assets/settings.py:/etc/pulp/settings.py:z"
      - "./assets/certs:/etc/pulp/certs:z"
      - "pulp:/var/lib/pulp"
    restart: always
    healthcheck:
      test: readyz.py /pulp/content/
      interval: 10s
      timeout: 5s
      retries: 5

  pulp_worker:
    <<: *pulp-image
    environment: *pulp-environment
    deploy:
        replicas: ${PULP_WORKER_REPLICAS:-1}
    command: ['pulp-worker']
    depends_on:
      object_storage_service:
        condition: service_completed_successfully
      container_auth_key_service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration_service:
        condition: service_completed_successfully
    user: pulp
    volumes:
      - "./assets/settings.py:/etc/pulp/settings.py:z"
      - "./assets/certs:/etc/pulp/certs:z"
      - "pulp:/var/lib/pulp"
    restart: always

volumes:
  rustfs_data:
    name: rustfs_data${DEV_VOLUME_SUFFIX:-dev}
  rustfs_logs:
    name: rustfs_logs${DEV_VOLUME_SUFFIX:-dev}
  pulp:
    name: pulp${DEV_VOLUME_SUFFIX:-dev}
  pg_data:
    name: pg_data${DEV_VOLUME_SUFFIX:-dev}
  redis_data:
    name: redis_data${DEV_VOLUME_SUFFIX:-dev}
